name: build
on:
  push:
    branches: [ gh-pages ]
jobs:
  container:
    runs-on: ubuntu-latest
    container: 
      image: there4/markdown-resume:latest
      options: -v /__w/cv/cv:/resume:rw
    steps:
      - run: |
          cd /resume
          md2resume pdf -t readable kp-resume.md .
        name: Run in container